<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2026 바디챌린지 · 멤버별 딥 플랜</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0c0e0b;
    --bg2:#14171210;
    --panel:#15181355;
    --panel-solid:#171b16;
    --line:#2a2f27;
    --ink:#eef2e9;
    --ink-dim:#9aa295;
    --ink-faint:#6c7466;
    --acc:#c4ff45;          /* electric lime */
    --acc-2:#7dd3fc;        /* cool blue for medical/safety */
    --warn:#ffb454;
    --danger:#ff7a7a;
    --radius:18px;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.62;-webkit-font-smoothing:antialiased;}
  body{
    background:
      radial-gradient(900px 500px at 85% -8%, rgba(196,255,69,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 12%, rgba(125,211,252,.07), transparent 55%),
      var(--bg);
    min-height:100dvh;
    padding-bottom:64px;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(12,14,11,.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{max-width:760px;margin:0 auto;padding:16px 18px 0;}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--acc);font-weight:700;text-transform:uppercase;}
  .title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;}
  .title small{color:var(--ink-faint);font-weight:600;font-size:12px;letter-spacing:0;}

  .tabs{
    display:flex;gap:7px;overflow-x:auto;padding:13px 18px 13px;margin:0 auto;max-width:760px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:8px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel-solid);color:var(--ink-dim);cursor:pointer;
    font-weight:700;font-size:14px;transition:.18s;white-space:nowrap;
  }
  .tab .num{font-size:10px;color:var(--ink-faint);font-weight:600;letter-spacing:.05em;}
  .tab[aria-selected="true"]{
    background:var(--acc);color:#0c0e0b;border-color:var(--acc);
    box-shadow:0 6px 20px -8px rgba(196,255,69,.6);
  }
  .tab[aria-selected="true"] .num{color:#0c0e0b;opacity:.65;}

  /* ---------- content ---------- */
  main{max-width:760px;margin:0 auto;padding:8px 18px 0;}
  .view{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .hero{
    border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(160deg,var(--panel-solid),#11140f);
    padding:20px 20px 18px;margin-top:14px;position:relative;overflow:hidden;
  }
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0,rgba(196,255,69,.09),transparent 70%);pointer-events:none;}
  .hero .name{font-size:27px;font-weight:800;letter-spacing:-.02em;}
  .hero .meta{color:var(--ink-dim);font-size:13px;font-weight:600;margin-top:2px;}
  .hero .oneline{margin-top:12px;font-size:14.5px;color:#dfe6d8;border-left:3px solid var(--acc);padding-left:12px;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .stat{background:#0e110c;border:1px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center;}
  .stat .v{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .stat .v small{font-size:10px;font-weight:600;color:var(--ink-faint);}
  .stat .l{font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-weight:600;}

  section{margin-top:18px;}
  .s-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .s-head .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);}
  .s-head h2{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}

  .card{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;}

  ul.goals{list-style:none;display:flex;flex-direction:column;gap:9px;}
  ul.goals li{display:flex;gap:10px;font-size:14px;color:#e3e9dd;}
  ul.goals li::before{content:"";flex:0 0 auto;width:16px;height:16px;margin-top:3px;border-radius:5px;border:1.5px solid var(--acc);background:rgba(196,255,69,.12);}

  .revise{font-size:13.5px;color:var(--ink-dim);background:rgba(125,211,252,.05);border:1px solid rgba(125,211,252,.22);border-radius:14px;padding:14px 15px;}
  .revise b{color:var(--acc-2);font-weight:700;}
  .revise .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--acc-2);background:rgba(125,211,252,.13);padding:3px 9px;border-radius:999px;margin-bottom:8px;}

  /* routine */
  .day-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .day-tab{flex:1;padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:#0e110c;color:var(--ink-dim);font-weight:700;cursor:pointer;transition:.16s;text-align:center;}
  .day-tab .dl{display:block;font-size:10px;color:var(--ink-faint);font-weight:600;margin-top:1px;letter-spacing:.03em;}
  .day-tab.on{background:var(--acc);color:#0c0e0b;border-color:var(--acc);}
  .day-tab.on .dl{color:#0c0e0b;opacity:.7;}
  .ex-hint{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .ex-hint::before{content:"👆";font-size:12px;}
  .exlist{list-style:none;display:flex;flex-direction:column;}
  .exlist li{border-bottom:1px dashed var(--line);}
  .exlist li:last-child{border-bottom:none;}
  .exrow-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;cursor:pointer;}
  .exrow-top .ex{font-size:14px;font-weight:600;color:#e8eee2;display:flex;align-items:center;gap:8px;}
  .exrow-top .hint{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:9px;color:var(--ink-faint);transition:.2s;}
  .exlist li.open .hint{transform:rotate(180deg);border-color:var(--acc);color:var(--acc);}
  .exrow-top .rep{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--acc);white-space:nowrap;background:rgba(196,255,69,.08);padding:3px 9px;border-radius:8px;}
  .ex-info{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .exlist li.open .ex-info{max-height:240px;}
  .ex-info-inner{padding:0 2px 14px;}
  .ex-info .cue{font-size:13px;color:var(--ink-dim);margin-bottom:11px;line-height:1.55;}
  .yt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#0c0e0b;background:var(--acc);padding:8px 14px;border-radius:10px;text-decoration:none;}
  .yt:active{transform:scale(.97);}
  .yt .pl{display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;background:#0c0e0b;color:var(--acc);border-radius:3px;font-size:8px;}
  .ex-note{padding:12px 2px;font-size:12.5px;color:var(--ink-faint);font-style:italic;}

  ul.diet{list-style:none;display:flex;flex-direction:column;gap:8px;}
  ul.diet li{display:flex;gap:10px;font-size:13.8px;color:#e3e9dd;}
  ul.diet li::before{content:"·";color:var(--acc);font-weight:900;font-size:18px;line-height:1.2;}

  .safety{background:rgba(255,122,122,.06);border:1px solid rgba(255,122,122,.25);border-radius:14px;padding:14px 15px;font-size:13.5px;color:#f3d9d9;}
  .safety .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--danger);background:rgba(255,122,122,.13);padding:3px 9px;border-radius:999px;margin-bottom:8px;}

  .rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .rule{font-size:11.5px;font-weight:700;color:var(--ink-dim);background:#0e110c;border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
  .rule b{color:var(--acc);}

  footer{max-width:760px;margin:30px auto 0;padding:0 18px;color:var(--ink-faint);font-size:11.5px;line-height:1.7;text-align:center;}
  footer .med{border-top:1px solid var(--line);padding-top:16px;}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="eyebrow">2026 Body Challenge · 2~3개월</div>
    <div class="title">멤버별 딥 플랜 <small>주 3회 인증 · 지속 가능한 식단</small></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<main id="main"></main>

<footer>

</footer>

  "푸쉬업 / 체스트프레스":"푸쉬업(팔굽혀펴기, 힘들면 무릎 대고) 또는 머신 체스트프레스로 가슴 운동.",
  "푸쉬업":"엎드려 팔굽혀펴기. 힘들면 무릎을 바닥에 대고.",
  "로우":"무게를 몸쪽으로 당기는 등 운동(머신·케이블·덤벨 모두 가능).",
  "한 다리 균형 운동":"한 발로 서서 균형 잡기. 코어와 발목을 안정시켜요.",
  "운동 후 좌우 대칭 스트레칭":"운동 후 양쪽을 똑같이 늘려 좌우 균형을 맞추는 마무리 스트레칭.",
  "식후 평지 걷기":"식사 후 평지에서 가볍게 걷기. 식후 혈당이 급격히 오르는 걸 막아줘요."
};

const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');
let dayState='A';

MEMBERS.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='tab';b.setAttribute('role','tab');
  b.setAttribute('aria-selected', i===0?'true':'false');
  b.dataset.idx=i;
  b.innerHTML=`<span>${m.name}</span><span class="num">${m.tag}</span>`;
  b.onclick=()=>select(i);
  tabsEl.appendChild(b);
});

function select(i){
  [...tabsEl.children].forEach((t,k)=>t.setAttribute('aria-selected',k===i?'true':'false'));
  dayState='A';
  render(MEMBERS[i]);
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(m){
  const stats=m.stats.map(s=>`<div class="stat"><div class="v">${s[0]}<small>${s[1]}</small></div><div class="l">${s[2]}</div></div>`).join('');
  const goals=m.goals.map(g=>`<li>${g}</li>`).join('');
  const diet=m.diet.map(d=>`<li>${d}</li>`).join('');
  mainEl.innerHTML=`
  <div class="view">
    <div class="hero">
      <div class="name">${m.name}</div>
      <div class="meta">${m.tag} · ${m.meta}</div>
      <div class="oneline">${m.oneline}</div>
      <div class="stats">${stats}</div>
    </div>

    <section>
      <div class="s-head"><span class="dot"></span><h2>2~3개월 목표</h2></div>
      <div class="card"><ul class="goals">${goals}</ul></div>
    </section>

    <section>
      <div class="s-head"><span class="dot" style="background:var(--acc-2);box-shadow:0 0 10px var(--acc-2)"></span><h2>처방에서 손본 부분</h2></div>
      <div class="revise"><span class="tag">REVISED</span><br>${m.revise}</div>
    </section>

    <section>
      <div class="s-head"><span class="dot"></span><h2>주 3회 루틴</h2></div>
      <div class="card">
        <p class="ex-hint">운동 이름을 누르면 방법 설명과 영상이 나와요</p>
        <div class="day-tabs" id="dayTabs"></div>
        <ul class="exlist" id="exlist"></ul>
      </div>
    </section>

    <section>
      <div class="s-head"><span class="dot"></span><h2>식단 (지속 가능 버전)</h2></div>
      <div class="card"><ul class="diet">${diet}</ul></div>
    </section>

    <section>
      <div class="s-head"><span class="dot" style="background:var(--danger);box-shadow:0 0 10px var(--danger)"></span><h2>안전핀</h2></div>
      <div class="safety"><span class="tag">SAFETY</span><br>${m.safety}</div>
    </section>
  </div>`;
  renderDays(m);
}

function renderDays(m){
  const dt=document.getElementById('dayTabs');
  const keys=Object.keys(m.routine);
  dt.innerHTML=keys.map(k=>`<button class="day-tab ${k===dayState?'on':''}" data-k="${k}">${k}일<span class="dl">${m.routine[k].label}</span></button>`).join('');
  [...dt.children].forEach(btn=>btn.onclick=()=>{dayState=btn.dataset.k;renderDays(m);});
  const list=document.getElementById('exlist');
  list.innerHTML=m.routine[dayState].items.map(it=>{
    const name=it[0], rep=it[1];
    if(name.startsWith('※')) return `<li><div class="ex-note">${name}</div></li>`;
    const base=name.replace(/\(.*?\)/g,'').trim();
    const cue=EXERCISE_INFO[base]||EXERCISE_INFO[name]||'';
    const q=encodeURIComponent(base.replace(/·/g,' ').replace(/\s+/g,' ').trim()+' 운동 방법');
    const yt='https://www.youtube.com/results?search_query='+q;
    return `<li>
      <div class="exrow-top"><span class="ex">${name}<span class="hint">▾</span></span><span class="rep">${rep}</span></div>
      <div class="ex-info"><div class="ex-info-inner">${cue?`<p class="cue">${cue}</p>`:''}<a class="yt" href="${yt}" target="_blank" rel="noopener"><span class="pl">▶</span>유튜브에서 영상 보기</a></div></div>
    </li>`;
  }).join('');
  [...list.querySelectorAll('.exrow-top')].forEach(t=>t.onclick=()=>t.parentElement.classList.toggle('open'));
}

render(MEMBERS[0]);
</script>
</body>
</html>
